name: BLOCKVERSE Unity Android

on:
  push:
    paths:
      - "projects/blockverse-unity/**"
      - ".github/workflows/unity-android.yml"
  pull_request:
    paths:
      - "projects/blockverse-unity/**"
      - ".github/workflows/unity-android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blockverse-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  project-preflight:
    name: Validate Unity project files
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify Unity project structure
        shell: bash
        run: |
          set -euo pipefail
          test -f projects/blockverse-unity/ProjectSettings/ProjectVersion.txt
          grep -q "6000.0.60f1" projects/blockverse-unity/ProjectSettings/ProjectVersion.txt
          test -d projects/blockverse-unity/Assets
          test -f projects/blockverse-unity/Packages/manifest.json
          echo "Unity project structure and declared editor version are present."
          echo "This preflight does not compile C# or replace Unity Editor validation."

  build-android:
    name: Build BLOCKVERSE Android
    needs: project-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify Unity credentials are configured
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "${UNITY_LICENSE}" ]] || missing+=("UNITY_LICENSE")
          [[ -n "${UNITY_EMAIL}" ]] || missing+=("UNITY_EMAIL")
          [[ -n "${UNITY_PASSWORD}" ]] || missing+=("UNITY_PASSWORD")
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing GitHub Actions secrets: %s\n' "${missing[*]}"
            exit 1
          fi
          echo "Unity credential secrets are present."

      - name: Build Android APK and AAB
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: projects/blockverse-unity
          unityVersion: 6000.0.60f1
          targetPlatform: Android
          buildName: BLOCKVERSE
          buildsPath: build
          androidAppBundle: true

      - name: Verify build output exists
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -d build/Android ]] || [[ -z "$(find build/Android -type f \( -name '*.apk' -o -name '*.aab' \) -print -quit)" ]]; then
            echo "No APK/AAB was produced under build/Android."
            find build -maxdepth 4 -type f -print || true
            exit 1
          fi
          find build/Android -type f \( -name '*.apk' -o -name '*.aab' \) -print

      - name: Upload Android build
        uses: actions/upload-artifact@v4
        with:
          name: BLOCKVERSE-Android-${{ github.run_number }}
          path: build/Android
          if-no-files-found: error
          retention-days: 14
