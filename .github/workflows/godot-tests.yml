name: Godot Engine Tests

on:
  push:
    paths:
      - "projects/block-puzzle/**"
      - ".github/workflows/godot-tests.yml"
  pull_request:
    paths:
      - "projects/block-puzzle/**"
      - ".github/workflows/godot-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engine-tests:
    name: Headless GDScript engine tests
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run engine tests
        working-directory: projects/block-puzzle
        run: godot --headless --path . --script res://tests/run_engine_tests.gd
