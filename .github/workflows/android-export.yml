name: BLOCKVERSE Android APK

on:
  push:
    paths:
      - "projects/block-puzzle/**"
      - ".github/workflows/android-export.yml"
  workflow_dispatch:
    inputs:
      project_path:
        description: "Godot project folder"
        required: true
        default: "projects/block-puzzle"
        type: string

permissions:
  contents: read

jobs:
  export:
    name: Export BLOCKVERSE APK
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Android project
        shell: bash
        env:
          PROJECT_DIR: ${{ inputs.project_path || 'projects/block-puzzle' }}
        run: |
          set -euo pipefail
          test -f "$PROJECT_DIR/project.godot"
          test -f "$PROJECT_DIR/export_presets.cfg"
          grep -q 'package/unique_name="com.dev.blockverse"' "$PROJECT_DIR/export_presets.cfg"
          mkdir -p "$PROJECT_DIR/build"

      - name: Install Godot Android export templates and debug key
        shell: bash
        env:
          PROJECT_DIR: ${{ inputs.project_path || 'projects/block-puzzle' }}
        run: |
          set -euo pipefail
          wget -q -O /tmp/godot-templates.tpz https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          unzip -q /tmp/godot-templates.tpz -d /tmp/godot-templates
          cp -R /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/4.4.1.stable/"
          mkdir -p "$PROJECT_DIR/build"
          keytool -genkeypair -v -keystore "$PROJECT_DIR/build/debug.keystore" -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          JAVA_BIN="$(readlink -f "$(command -v javac)")"
          JAVA_HOME="$(dirname "$(dirname "$JAVA_BIN")")"
          ANDROID_SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/opt/android-sdk}}"
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          EOF

      - name: Import Godot resources
        shell: bash
        env:
          PROJECT_DIR: ${{ inputs.project_path || 'projects/block-puzzle' }}
        run: godot --headless --editor --path "$PROJECT_DIR" --quit

      - name: Export debug APK
        shell: bash
        env:
          PROJECT_DIR: ${{ inputs.project_path || 'projects/block-puzzle' }}
        run: |
          set -euo pipefail
          godot --headless --path "$PROJECT_DIR" --export-debug "Android" "$PROJECT_DIR/build/BLOCKVERSE.apk"
          test -s "$PROJECT_DIR/build/BLOCKVERSE.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BLOCKVERSE-Android-APK
          path: ${{ inputs.project_path || 'projects/block-puzzle' }}/build/BLOCKVERSE.apk
          if-no-files-found: error
          retention-days: 14
