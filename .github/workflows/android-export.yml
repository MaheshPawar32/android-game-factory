name: BLOCKVERSE Android APK

on:
  push:
    paths:
      - "projects/block-puzzle/**"
      - ".github/workflows/android-export.yml"
  workflow_dispatch:
    inputs:
      project_path:
        description: "Godot project folder"
        required: true
        default: "projects/block-puzzle"
        type: string

permissions:
  contents: read

jobs:
  export:
    name: Export BLOCKVERSE APK
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Android project
        shell: bash
        env:
          PROJECT_DIR: ${{ inputs.project_path || 'projects/block-puzzle' }}
        run: |
          set -euo pipefail
          test -f "$PROJECT_DIR/project.godot"
          test -f "$PROJECT_DIR/export_presets.cfg"
          grep -q 'package/unique_name="com.dev.blockverse"' "$PROJECT_DIR/export_presets.cfg"
          mkdir -p "$PROJECT_DIR/build"

      - name: Import Godot resources
        shell: bash
        env:
          PROJECT_DIR: ${{ inputs.project_path || 'projects/block-puzzle' }}
        run: godot --headless --editor --path "$PROJECT_DIR" --quit

      - name: Export debug APK
        shell: bash
        env:
          PROJECT_DIR: ${{ inputs.project_path || 'projects/block-puzzle' }}
        run: |
          set -euo pipefail
          godot --headless --path "$PROJECT_DIR" --export-debug "Android" "$PROJECT_DIR/build/BLOCKVERSE.apk"
          test -s "$PROJECT_DIR/build/BLOCKVERSE.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BLOCKVERSE-Android-APK
          path: ${{ inputs.project_path || 'projects/block-puzzle' }}/build/BLOCKVERSE.apk
          if-no-files-found: error
          retention-days: 14
